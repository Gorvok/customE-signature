name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# One run per branch: a new push cancels the run for the previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # Separate job: it needs a browser download, which would otherwise hold up the
  # fast lint/typecheck/unit feedback.
  e2e:
    # Pinned, not ubuntu-latest: that now resolves to Ubuntu 26.04, which
    # Playwright 1.56 cannot install browser system dependencies for
    # ("Playwright does not support chromium on ubuntu26.04-x64"). Revisit when
    # a Playwright release officially supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only chromium: the suite runs on it alone (see playwright.config.ts).
      - run: npx playwright install --with-deps chromium

      # Builds first, then drives a real service worker update cycle in a browser.
      - run: npm run test:e2e
