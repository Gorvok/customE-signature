<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The SVG is the real one; the PNGs are for anything that ignores it. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Envoi — free, open-source email signature generator. Build a professional signature in your browser — no login, no tracking, nothing sent to a server." />
    <meta name="theme-color" content="#14110E" />
    <!-- Safari ignores manifest icons for Add to Home Screen. -->
    <link rel="apple-touch-icon" href="/icons/app-180.png" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Envoi — Email Signature Generator" />
    <meta property="og:description" content="Build a professional email signature in your browser — free, open source, no login, no tracking." />
    <meta property="og:url" content="https://gorvok.github.io/customE-signature/" />
    <meta property="og:image" content="https://gorvok.github.io/customE-signature/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Envoi — Email Signature Generator" />
    <meta name="twitter:description" content="Build a professional email signature in your browser — free, open source, no login, no tracking." />
    <meta name="twitter:image" content="https://gorvok.github.io/customE-signature/og.png" />

    <title>Envoi — Email Signature Generator</title>
    <script>
      // Apply the saved/preferred theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
